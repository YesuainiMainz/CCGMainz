</style><header><div class="mcg-language-row"><h1>CCG Mainz Lager · 私密家庭端</h1><button id="mcgLanguageSwitch" type="button" data-no-translate>切換為繁體中文</button></div><span id="mcgLanguageStatus" class="mcg-language-status" data-no-translate role="status"></span><div>仅授权成员可查看库存</div><div style="margin-top:8px"><a href="./platform.html" style="color:#fff">前往 CCG Mainz幸福家人数字平台 →</a></div></header><main><section class="card" id="authPanel"><h2>家庭成员登录 / 注册</h2><p>首次注册后等待管理员批准。未批准前无法查看库存。</p><div class="grid"><label>邮箱<input id="authEmail" type="email" autocomplete="username"></label><label>密码（至少6位）<input id="authPassword" type="password" autocomplete="current-password"></label></div><div class="grid"><label>家庭名称（注册时填写）<input id="registerFamily" maxlength="80"></label><label>联系人（注册时填写）<input id="registerMember" maxlength="60"></label></div><button type="button" id="familyLoginButton" onclick="fzhLogin()">登录</button><button type="button" onclick="fzhRegister()">注册并申请加入</button><button type="button" class="alt" onclick="fzhResetPassword()">重置密码</button><button type="button" class="alt" id="familyLogoutButton" onclick="fzhLogout()">退出登录</button><p id="authStatus" class="warn" aria-live="polite">请登录。</p></section><div id="privateContent" hidden>
<div class="card"><h2>家庭资料</h2><label>家庭名称 <input id="familyName" placeholder="例如：恩典之家" oninput="savePrefs()"></label><label>申请人名字 <input id="memberName" placeholder="例如：小明" oninput="savePrefs()"></label><p class="muted">仅批准的家庭成员可以查看云端库存，并在线提交借用或领取申请。</p></div>
<div class="card"><h2>在线库存自动更新</h2><p>仅获批准的成员可以实时读取云端库存；无需导入更新包。</p>
<p id="lastInventoryChange" class="muted">上次更改时间：正在读取…</p>
<p id="syncStatus" class="warn" aria-live="polite">正在准备同步…</p></div>
<div class="card"><p id="status" class="warn">登录并获批准后加载私密库存。</p></div>
<div class="card"><h2>物品目录</h2><div class="grid">
<label>搜索方式<select id="searchMode" onchange="updateSearchControls();render()"><option value="name">名称</option><option value="category">分类</option><option value="location">存放位置</option><option value="qty">数量</option></select></label>
<label id="searchTextWrap">搜索内容<input id="search" placeholder="输入物品名称" oninput="render()"></label>
<label id="searchChoiceWrap" style="display:none">筛选选项<select id="searchChoice" onchange="render()"></select></label>
<label id="qtyModeWrap" style="display:none">数量比较<select id="qtyMode" onchange="render()"><option value="eq">等于</option><option value="gte">大于或等于</option><option value="lte">小于或等于</option></select></label>
</div><div class="scroll inventory-scroll" id="inventoryScroll"><table><thead><tr><th>照片</th><th>名称</th><th>位置</th><th>备注</th><th>库存</th><th>申请</th></tr></thead><tbody id="items"></tbody></table></div></div>
<div class="card"><h2>在线申请记录</h2><p class="muted">在线申请自动发送管理员审批，状态实时更新。</p><div id="requests" class="request-history-scroll" aria-label="家庭申请记录，可上下滑动"></div></div>
</div></main><div id="appModal" class="app-modal" hidden role="dialog" aria-modal="true" aria-labelledby="appModalTitle">
 <div class="app-modal-box"><h3 id="appModalTitle">确认操作</h3><p id="appModalMessage"></p>
 <div id="appModalFields" hidden>
  <label>申请类型<select id="modalKind"><option value="借用">借用</option><option value="领取">领取</option></select></label>
  <label id="modalQtyLabel">申请数量<input id="modalQty" type="number" inputmode="numeric" step="1" min="1" value="1"></label>
  <p id="modalError" class="modal-error" aria-live="polite"></p>
 </div>
 <div class="app-modal-actions"><button type="button" class="alt" id="appModalCancel">取消</button><button type="button" id="appModalOK">确定</button></div></div>
</div>

<div id="photoLightbox" class="photo-lightbox" role="dialog" aria-modal="true" aria-label="物品照片放大查看" onclick="closePhotoLightbox()"><button type="button" class="lightbox-close" onclick="closePhotoLightbox()" aria-label="关闭大图">× 关闭</button><img id="lightboxImage" alt="物品大图" onclick="event.stopPropagation()"><div id="lightboxTitle" class="lightbox-title"></div></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="./firebase-config.js"></script><script>
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const uuid=()=>typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);

function readJSON(file){return new Promise((resolve,reject)=>{if(!file||file.size>15000000)return reject(Error('文件过大或未选择'));let r=new FileReader();r.onload=()=>{try{resolve(JSON.parse(r.result))}catch{reject(Error('不是有效的 JSON 文件'))}};r.onerror=()=>reject(Error('无法读取文件'));r.readAsText(file)})}
function msg(t){const el=$('status');if(el){el.textContent=t;el.scrollIntoView({block:'nearest',behavior:'smooth'})}else console.warn(t)}
function saveLocal(k,v){if(k==='fzh_family_v2')return true;try{localStorage.setItem(k,JSON.stringify(v));return true}catch{msg('保存失败：可能是浏览器存储已满，请先保存申请文件。');return false}}
function loadLocal(k,fallback){if(k==='fzh_family_v2')return fallback;try{return JSON.parse(localStorage.getItem(k))||fallback}catch{return fallback}}

function validSnapshot(x){return x&&x.type==='fzh-stock-snapshot'&&x.schema===1&&Number.isSafeInteger(x.version)&&x.version>=0&&Array.isArray(x.items)&&x.items.length<=5000&&x.items.every(i=>typeof i.id==='string'&&typeof i.name==='string'&&Number.isFinite(i.qty)&&i.qty>=0)}

function showAppModal(title,message,fields=false,maxQty=1){
 return new Promise(resolve=>{
  const modal=$('appModal'),ok=$('appModalOK'),cancel=$('appModalCancel');
  $('appModalTitle').textContent=title;$('appModalMessage').textContent=message;
  $('appModalFields').hidden=!fields;$('modalError').textContent='';
  if(fields){$('modalQty').max=String(maxQty);$('modalQty').value='1';$('modalQtyLabel').firstChild.textContent='申请数量（1—'+maxQty+'）';$('modalKind').value='借用'}
  modal.hidden=false;
  const finish=value=>{modal.hidden=true;ok.removeEventListener('click',accept);cancel.removeEventListener('click',reject);resolve(value)};
  const reject=()=>finish(null);
  const accept=()=>{
   if(!fields)return finish(true);
   const n=Number($('modalQty').value);
   if(!$('modalQty').value.trim()||!Number.isSafeInteger(n)||n<1||n>maxQty){$('modalError').textContent='请输入1至'+maxQty+'之间的整数';return}
   finish({kind:$('modalKind').value,qty:n});
  };
  ok.addEventListener('click',accept);cancel.addEventListener('click',reject);
 });
}
async function confirmThree(action,detail){
 return await showAppModal('确认操作','确定'+action+'「'+detail+'」吗？');
}

let onlineRequests=[];const KEY='fzh_family_v2';let db=loadLocal(KEY,{version:-1,items:[],requests:[],family:'',member:'',categories:[],locations:[]});
function persist(){saveLocal(KEY,db);render()}
function savePrefs(){db.family=$('familyName').value;db.member=$('memberName').value;saveLocal(KEY,db)}
$('familyName').value=db.family;$('memberName').value=db.member;
function updateSearchControls(){
 const mode=$('searchMode').value,choice=$('searchChoice');
 const useChoice=mode==='category'||mode==='location';
 $('searchTextWrap').style.display=useChoice?'none':'';
 $('searchChoiceWrap').style.display=useChoice?'':'none';
 $('qtyModeWrap').style.display=mode==='qty'?'':'none';
 $('search').placeholder=mode==='qty'?'输入整数数量':'输入物品名称';
 if(useChoice){
  const key=mode==='category'?'categories':'locations';
  const field=mode==='category'?'category':'location';
  const values=Array.isArray(db[key])&&db[key].length?db[key]:[...new Set(db.items.map(i=>i[field]).filter(Boolean))];
  const signature=mode+'|'+JSON.stringify(values);
  if(choice.dataset.signature!==signature){const previous=choice.value;
   choice.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
   choice.dataset.signature=signature;
   if(values.includes(previous))choice.value=previous;
  }
 }
}
function limitInventoryToTenRows(){
 const panel=document.getElementById('inventoryScroll');
 const table=panel.querySelector('table');
 const rows=Array.from(table.tBodies[0].rows);
 const headerHeight=table.tHead.getBoundingClientRect().height;
 const visibleHeight=rows.slice(0,5).reduce((total,row)=>{
  const style=getComputedStyle(row);
  return total+row.getBoundingClientRect().height+parseFloat(style.marginTop||0)+parseFloat(style.marginBottom||0);
 },0);
 panel.style.maxHeight=Math.ceil(headerHeight+visibleHeight+4)+'px';
}


document.getElementById('items').addEventListener('click',function(event){
 const button=event.target.closest('button[data-photo-id]');
 if(!button||!this.contains(button))return;
 event.preventDefault();
 showPhotoById(button.getAttribute('data-photo-id'));
});
function showPhotoById(id){
 const item=db.items.find(i=>i.id===id);
 if(!item||!familyPhoto(item))return;
 const viewer=document.getElementById('photoLightbox');
 document.getElementById('lightboxImage').src=familyPhoto(item);
 document.getElementById('lightboxTitle').textContent=item.name;
 viewer.classList.add('open');
 viewer.style.display='flex';
 document.body.style.overflow='hidden';
}
function closePhotoLightbox(){
 const viewer=document.getElementById('photoLightbox');
 viewer.classList.remove('open');
 viewer.style.display='none';
 document.body.style.overflow='';
 document.getElementById('lightboxImage').removeAttribute('src');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePhotoLightbox()});

const familyPhotos=new Map();
function familyPhoto(i){return familyPhotos.get(i.id)||i.photo||'';}
function render(){
 updateSearchControls();
 $('status').textContent=db.version<0?'尚未收到云端库存。':`云端库存版本 V${db.version} · ${db.items.length} 种物品（实时同步）`;
 let q=$('search').value.trim().toLowerCase(),mode=$('searchMode').value,choice=$('searchChoice').value;
 $('items').innerHTML=db.items.filter(i=>mode==='name'?i.name.toLowerCase().includes(q):mode==='category'?(!choice||i.category===choice):mode==='location'?(!choice||i.location===choice):q===''?true:(Number.isFinite(Number(q))&&($('qtyMode').value==='eq'?i.qty===Number(q):$('qtyMode').value==='gte'?i.qty>=Number(q):i.qty<=Number(q)))).map(i=>`<tr><td>${familyPhoto(i)?`<button type="button" class="photo-open" data-photo-id="${esc(i.id)}" title="点击查看大图" aria-label="放大查看 ${esc(i.name)} 的图片"><img class="photo zoomable-photo" src="${familyPhoto(i)}" alt="${esc(i.name)}的照片"></button>`:'📦'}</td><td><b>${esc(i.name)}</b><br><small>${esc(i.category)}</small></td><td>${esc(i.location)}</td><td class="item-notes">${i.notes?esc(i.notes):'<span class="muted">—</span>'}</td><td>${i.qty} ${esc(i.unit)}</td><td><button onclick="requestItem('${i.id}')">申请</button></td></tr>`).join('');
 limitInventoryToTenRows();
 $('requests').innerHTML=onlineRequests.map(r=>`<div class="request-history-row">📄 ${esc(r.itemName)} × ${r.qty}（${esc(r.kind)}） · <b>${esc(r.status)}</b>${r.kind==='借用'?' · 已归还 '+(r.returnedQty||0)+'/'+r.qty:''}</div>`).join('')||'<p class="muted">暂无在线申请</p>';
 requestAnimationFrame(limitFamilyRequestRows);
}
function limitFamilyRequestRows(){
 const panel=$('requests');if(!panel)return;
 const rows=Array.from(panel.querySelectorAll('.request-history-row')).slice(0,3);
 if(!rows.length){panel.style.maxHeight='';return;}
 const height=rows.reduce((sum,row)=>{
  const style=getComputedStyle(row);
  return sum+row.getBoundingClientRect().height+parseFloat(style.marginTop||0)+parseFloat(style.marginBottom||0);
 },0);
 panel.style.maxHeight=Math.ceil(height+2)+'px';
}
window.addEventListener('resize',()=>requestAnimationFrame(limitFamilyRequestRows));
// Firestore 实时同步仅在通过服务端授权后启用。
let syncingInventory=false;


async function requestItem(id){
 const i=db.items.find(x=>x.id===id);
 if(!i||!window.fzhUser||!window.fzhApproved)return msg('请先登录并通过管理员审批');
 if(!Number.isSafeInteger(i.qty)||i.qty<1)return msg('库存不足');
 const selected=await showAppModal('在线申请物品',i.name+'｜当前库存：'+i.qty+' '+(i.unit||'件'),true,i.qty);
 if(!selected)return;
 if(!await confirmThree('提交在线申请',i.name+' × '+selected.qty))return;
 const button=document.activeElement;if(button?.tagName==='BUTTON')button.disabled=true;
 try{
  const uid=window.fzhUser.uid,requestId=uuid();
  await fzhStore.collection('onlineRequests').doc(requestId).set({
   uid,memberEmail:window.fzhUser.email||'',family:db.family,member:db.member,
   itemId:i.id,itemName:i.name,kind:selected.kind,qty:selected.qty,
   status:'pending',returnedQty:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  document.getElementById('syncStatus').textContent='在线申请已提交，等待管理员审批（不需发送文件）。';
 }catch(e){msg('在线申请提交失败：'+e.message)}finally{if(button?.tagName==='BUTTON')button.disabled=false}
}


window.addEventListener('resize',()=>{limitInventoryToTenRows()});
render();
</script><script>
let fzhAuth, fzhStore, fzhUnsub=null, fzhRequestsUnsub=null, fzhPhotoUnsub=null;window.fzhUser=null;window.fzhApproved=false;
function fzhSetStatus(t){document.getElementById('authStatus').textContent=t;}
let familyLoginPending=false;
function setFamilyLoginButtonState(){const b=$('familyLoginButton');if(!b)return;b.disabled=!!(fzhAuth?.currentUser||familyLoginPending);b.textContent=fzhAuth?.currentUser?'已登录':familyLoginPending?'登录中…':'登录';}

// 使用 Firestore 持久缓存：重复登录可先使用本地缓存，网络连接后仍会更新。
function ccgEnableFirestoreCache(store){
 if(!store||typeof store.enablePersistence!=='function')return;
 store.enablePersistence({synchronizeTabs:true}).catch(e=>{
  if(e.code!=='failed-precondition'&&e.code!=='unimplemented')console.warn('Firestore 缓存不可用',e);
 });
}
function fzhInit(){
 const c=window.FZH_FIREBASE_CONFIG;
 if(!c||c.apiKey.startsWith('REPLACE')){fzhSetStatus('尚未配置 Firebase，请管理员先编辑 firebase-config.js');return;}
 firebase.initializeApp(c);fzhAuth=firebase.auth();fzhStore=firebase.firestore();ccgEnableFirestoreCache(fzhStore);fzhAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e=>console.warn(e));
 fzhAuth.onAuthStateChanged(async u=>{
  if(fzhUnsub){fzhUnsub();fzhUnsub=null;}if(fzhPhotoUnsub){fzhPhotoUnsub();fzhPhotoUnsub=null;}familyPhotos.clear();if(fzhRequestsUnsub){fzhRequestsUnsub();fzhRequestsUnsub=null;}onlineRequests=[];window.fzhUser=u;window.fzhApproved=false;setFamilyLoginButtonState();
  document.getElementById('privateContent').hidden=true;
  db.items=[];db.version=-1;db.categories=[];db.locations=[];render();
  if(!u){fzhSetStatus('请登录；新账号需管理员审批。');return;}
  try{const p=await fzhStore.doc('members/'+u.uid).get();
   if(!p.exists||p.data().status!=='approved'){fzhSetStatus(p.exists&&p.data().status==='blocked'?'账号已被管理员停用，请联系管理员。':'已登录，等待管理员审批。批准后请退出再登录。');return;}
   window.fzhApproved=true;document.getElementById('privateContent').hidden=false;fzhSetStatus('身份已验证：'+(p.data().family||u.email));
   db.family=p.data().family||'';db.member=p.data().member||'';document.getElementById('familyName').value=db.family;document.getElementById('memberName').value=db.member;
   fzhRequestsUnsub=fzhStore.collection('onlineRequests').where('uid','==',u.uid).onSnapshot(s=>{
     onlineRequests=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));render();
    },e=>{document.getElementById('syncStatus').textContent='申请记录读取失败：'+e.message});
    fzhUnsub=fzhStore.doc('private/inventory').onSnapshot(s=>{
    if(!s.exists){document.getElementById('syncStatus').textContent='管理员尚未发布库存';return;}
    const data=s.data().snapshot;if(!validSnapshot(data))throw Error('云端库存格式错误');
    db.version=data.version;db.items=data.items;db.categories=data.categories||[];db.locations=data.locations||[];
    delete document.getElementById('searchChoice').dataset.signature;render();
    if(!fzhPhotoUnsub){fzhPhotoUnsub=fzhStore.collection('itemPhotos').onSnapshot(s=>{familyPhotos.clear();s.forEach(d=>{if(typeof d.data().data==='string')familyPhotos.set(d.id,d.data().data)});render();},e=>console.warn('照片同步失败',e));}
    document.getElementById('syncStatus').textContent='库存已自动同步 · V'+db.version;const stamp=s.data().updatedAt;document.getElementById('lastInventoryChange').textContent='上次更改时间：'+(stamp&&typeof stamp.toDate==='function'?stamp.toDate().toLocaleString('zh-CN'):'暂无记录');
   },e=>{document.getElementById('syncStatus').textContent='库存读取失败：'+e.message;document.getElementById('privateContent').hidden=true;});
  }catch(e){fzhSetStatus('验证失败：'+e.message);}
 });
}
async function fzhLogin(){
 if(!fzhAuth||fzhAuth.currentUser||familyLoginPending)return;
 familyLoginPending=true;setFamilyLoginButtonState();
 try{await fzhAuth.signInWithEmailAndPassword($('authEmail').value.trim(),$('authPassword').value)}
 catch(e){fzhSetStatus(e.message)}
 finally{familyLoginPending=false;setFamilyLoginButtonState()}
}
async function fzhRegister(){
 try{const email=document.getElementById('authEmail').value.trim(),pass=document.getElementById('authPassword').value, family=document.getElementById('registerFamily').value.trim(),member=document.getElementById('registerMember').value.trim();
 if(!family||!member)throw Error('请填写家庭名称和联系人');
 const c=await fzhAuth.createUserWithEmailAndPassword(email,pass);
 await fzhStore.doc('members/'+c.user.uid).set({uid:c.user.uid,email:email,family:family.slice(0,80),member:member.slice(0,60),status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
 fzhSetStatus('注册成功，等待管理员批准。批准前不能查看库存。');
 }catch(e){fzhSetStatus('注册失败：'+e.message)}
}
async function fzhResetPassword(){try{const email=document.getElementById('authEmail').value.trim();if(!email)throw Error('请填写邮箱');await fzhAuth.sendPasswordResetEmail(email);fzhSetStatus('若邮箱已注册，将收到重置密码邮件。')}catch(e){fzhSetStatus(e.message)}}
let familyLogoutPending=false;
async function fzhLogout(){
 if(familyLogoutPending||!fzhAuth?.currentUser)return;
 familyLogoutPending=true;
 const button=$('familyLogoutButton');button.disabled=true;
 try{
  const accepted=await showAppModal('确认退出登录','确定退出当前家庭账号吗？');
  if(!accepted)return;
  await fzhAuth.signOut();
  try{localStorage.removeItem('fzh_family_v2')}catch{}
  fzhSetStatus('已退出登录。');
 }catch(e){fzhSetStatus('退出失败：'+e.message)}
 finally{familyLogoutPending=false;button.disabled=false}
}
try{fzhInit()}catch(e){fzhSetStatus('Firebase 初始化失败：'+e.message)}
</script><script src="./zh-toggle.js"></script></html>

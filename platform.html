<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCG幸福家人数字平台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#193c2d;font-family:system-ui,"Microsoft YaHei",sans-serif}
header{background:#24583e;color:white;padding:32px 18px}header>div{max-width:920px;margin:auto}
h1{font-size:clamp(1.55rem,4vw,2.25rem);margin:0 0 10px}header p{margin:0;opacity:.9}
main{max-width:920px;margin:26px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
a.tile{display:flex;flex-direction:column;gap:14px;min-height:205px;padding:25px;border-radius:18px;background:white;color:inherit;text-decoration:none;box-shadow:0 3px 16px #0001;border:1px solid #e2e9e3}
a.tile:hover,a.tile:focus-visible{border-color:#3b805a;box-shadow:0 6px 18px #0002}
.tile-icon{font-size:38px}.tile-title{font-size:1.4rem;font-weight:750}.tile-sub{color:#62786b;line-height:1.6}
.tile-arrow{margin-top:auto;font-weight:600;color:#256a48}
.note{margin-top:22px;color:#65796a;font-size:14px;line-height:1.7}
.mcg-language-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
#mcgLanguageSwitch{border:1px solid #fff;background:white;color:#24583e;padding:10px 15px;border-radius:9px;cursor:pointer;font-size:15px}
#mcgLanguageSwitch:disabled{opacity:.6}.mcg-language-status{color:#ffe4b5;font-size:13px}
@media(max-width:650px){.grid{grid-template-columns:1fr}a.tile{min-height:165px;padding:20px}.mcg-language-row{align-items:stretch}#mcgLanguageSwitch{width:100%}}
</style></head><body>
<header><div><div class="mcg-language-row"><h1>MCG幸福家人数字平台</h1><button id="mcgLanguageSwitch" type="button" data-no-translate>切換為繁體中文</button></div>
<span id="mcgLanguageStatus" class="mcg-language-status" data-no-translate role="status"></span>
<p>分享知识 · 传递爱心 · 彼此帮助</p></div></header>
<main><div class="grid">
<a class="tile" href="./library.html"><span class="tile-icon" aria-hidden="true">📚</span><span class="tile-title">MCG图书馆</span>
<span class="tile-sub">查看教会图书、浏览照片、查询库存，并提交借书意向。</span><span class="tile-arrow">进入图书馆 →</span></a>
<a class="tile" href="./posts.html"><span class="tile-icon" aria-hidden="true">❤️</span><span class="tile-title">MCG爱心站</span>
<span class="tile-sub">分享闲置物品，查看他人的分享，提交需求，由管理员安排匹配。</span><span class="tile-arrow">进入爱心站 →</span></a>
</div><p class="note">两个服务均可直接浏览，无需登录。图书借阅申请和爱心站需求申请由管理员分别处理。</p></main>
<script src="./zh-toggle.js"></script></body></html>

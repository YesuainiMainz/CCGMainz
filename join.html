<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幸福家人扫码入口</title><style>body{font:16px system-ui;background:#f3f6f3;color:#24583e;padding:30px;text-align:center}main{background:white;max-width:550px;margin:10vh auto;padding:30px;border-radius:15px}</style></head><body><main><h1>CCGMainz 幸福家人</h1><p id="status">正在验证二维码…</p></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="./firebase-config.js"></script><script>(async()=>{const el=document.getElementById('status'),t=new URLSearchParams(location.search).get('t')||'';if(!/^[a-f0-9]{48}$/.test(t)){el.textContent='二维码无效，请获取最新二维码';return}try{const a=firebase.apps.find(x=>x.name==='qr-gateway')||firebase.initializeApp(window.FZH_FIREBASE_CONFIG,'qr-gateway');const d=await a.firestore().doc('publicConfig/familyQr').get({source:'server'});if(!d.exists||d.data().token!==t){el.textContent='此二维码已失效，请获取最新二维码';return}el.textContent='验证成功，正在进入平台…';location.replace('./platform.html')}catch(e){el.textContent='无法在线验证二维码，请联网后重试'}})();</script></body></html>

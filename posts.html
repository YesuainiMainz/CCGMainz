<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCGMainz爱心站</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#20392b;font-family:system-ui,"Microsoft YaHei",sans-serif}
header{background:#22583d;color:#fff;padding:20px 16px}header>div{max-width:850px;margin:auto}h1{margin:0 0 6px;font-size:1.65rem}
main{max-width:850px;margin:16px auto;padding:0 12px}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}
label{display:block;font-weight:600;margin:12px 0 6px}input[type=text],textarea{display:block;width:100%;border:1px solid #c5d4c9;border-radius:9px;padding:12px;font-size:16px;font:inherit}
textarea{min-height:110px;resize:vertical}button{border:0;border-radius:9px;background:#276c4b;color:white;padding:11px 18px;min-height:44px;font-size:15px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}.muted{color:#617567;font-size:14px}.warn{color:#9a441e}
#preview{max-height:240px;max-width:100%;object-fit:contain;border-radius:10px;margin-top:10px}
#feed{display:grid;gap:12px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.post{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 12px #0001;overflow-wrap:anywhere}
.post-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.post time{color:#6b7e70;font-size:13px}.post p{white-space:pre-wrap;line-height:1.7;margin:9px 0}
.post img{display:block;max-width:100%;max-height:550px;object-fit:contain;border-radius:10px;cursor:zoom-in}
#viewer[hidden]{display:none}#viewer{position:fixed;inset:0;background:#000e;z-index:5;display:flex;align-items:center;justify-content:center;padding:12px}
#viewer img{max-width:96vw;max-height:85vh;object-fit:contain}#viewer button{position:absolute;right:15px;top:15px;background:white;color:#111}
a{color:inherit}#more{display:block;margin:15px auto}
@media(max-width:560px){.card,.post{padding:13px}header{padding:16px 12px}}
#needDialog[hidden]{display:none}#needDialog{position:fixed;inset:0;background:#000a;z-index:6;display:flex;justify-content:center;align-items:center;padding:12px}#needForm{width:min(100%,500px);max-height:92vh;overflow:auto}#needForm h2{margin-top:0}button.secondary{background:#68776d}button.need{margin-top:12px}.photo-previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photo-previews img{width:100px;height:100px;object-fit:cover;border-radius:8px}.post-gallery{display:flex;flex-wrap:wrap;gap:8px}.post-gallery img{max-width:min(100%,320px);max-height:300px}

.mcg-language-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.mcg-language-row h1{margin:0}
#mcgLanguageSwitch{background:#fff;color:#22583d;border:1px solid #fff;border-radius:9px;padding:9px 14px;min-height:42px;cursor:pointer;font-size:15px;font-weight:600}
#mcgLanguageSwitch:disabled{opacity:.6;cursor:wait}
.mcg-language-status{display:block;color:#ffe7bf;font-size:13px;margin-top:5px}
@media(max-width:560px){.mcg-language-row{align-items:stretch}.mcg-language-row h1{flex:1 1 100%}#mcgLanguageSwitch{width:100%}}
</style></head><body>
<header><div><div class="mcg-language-row"><h1>CCGMainz爱心站</h1><button id="mcgLanguageSwitch" type="button" data-no-translate>切換為繁體中文</button></div><span id="mcgLanguageStatus" class="mcg-language-status" role="status" data-no-translate></span><span>分享家中闲置或多余的物品 · 需求申请会通知发布者</span></div></header>
<main><p><a href="./platform.html" style="color:#22583d">← 返回 CCGMainz幸福家人数字平台</a></p><section class="card"><h2>发布闲置物品</h2>
<form id="postForm">
<p id="postingIdentity" class="muted">正在验证会员身份…</p>
<label for="body">物品说明（可选）</label><textarea id="body" maxlength="1500" placeholder="请描述闲置或多余的物品（最多1500字）"></textarea>
<label for="image">上传图片（可选，最多4张，可追加）</label><input id="image" type="file" multiple accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/*">
<div id="photoPreviews" class="photo-previews"></div><img id="preview" hidden alt="图片预览">
<p class="muted">文字和图片至少填写一项。发布帖子将公开显示您注册的真实姓名。请勿在公开文字或图片中写入电话、地址等隐私。</p>
<button id="publish" type="submit">发布物品</button><p id="publishStatus" class="muted" role="status"></p>
</form></section>
<section><h2>最新闲置物品</h2><p class="muted" id="feedStatus">正在加载…</p><div id="feed"></div><button id="more" type="button" hidden>加载更多</button></section>
</main>
<div id="needDialog" hidden role="dialog" aria-modal="true" aria-labelledby="needTitle"><form id="needForm" class="card"><h2 id="needTitle">我有需要</h2><p id="needItem"></p><label for="requester">您的真实姓名（由账号自动填写） *</label><input id="requester" type="text" maxlength="40" readonly required><label for="needDetails">大致需要的物品及数量 *</label><textarea id="needDetails" maxlength="500" required placeholder="例如：儿童外套2件、书包1个"></textarea><p class="muted">需求内容仅发布者和管理员可见。双方请通过其他方式自行联系。请勿在公开物品说明中留下联系方式。</p><button id="sendNeed" type="submit">发送给发布者</button><button id="cancelNeed" type="button" class="secondary">取消</button><p id="needStatus" role="status"></p></form></div><div id="viewer" hidden role="dialog" aria-modal="true" aria-label="查看图片"><button id="closeViewer" type="button">关闭 ×</button><img id="largeImage" alt="物品图片"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="./firebase-config.js"></script><script src="./member-session.js"></script>
<script>
const $=id=>document.getElementById(id);

// 使用 Firestore 持久缓存：重复登录可先使用本地缓存，网络连接后仍会更新。
function ccgEnableFirestoreCache(store){
 if(!store||typeof store.enablePersistence!=='function')return;
 store.enablePersistence({synchronizeTabs:true}).catch(e=>{
  if(e.code!=='failed-precondition'&&e.code!=='unimplemented')console.warn('Firestore 缓存不可用',e);
 });
}
let memberReady=false;
let selectedPhotos=[];let editingPostId=null;let db=null,posts=[],nextPage=null,loading=false,hasMore=true,selectedPhoto='',chosenPost=null,needBusy=false;
function make(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
function openPhoto(src){$('largeImage').src=src;$('viewer').hidden=false}
function closePhoto(){$('viewer').hidden=true;$('largeImage').removeAttribute('src')}
$('closeViewer').onclick=closePhoto;
$('viewer').addEventListener('click',e=>{if(e.target===$('viewer'))closePhoto()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePhoto()});
function limitFeedTen(){
 const feed=$('feed');const cards=[...feed.children].slice(0,10);
 const style=getComputedStyle(feed),gap=parseFloat(style.rowGap)||12;
 feed.style.maxHeight=cards.length?Math.ceil(cards.reduce((n,card)=>n+card.getBoundingClientRect().height,0)+gap*Math.max(0,cards.length-1)+2)+'px':'none';
}
window.addEventListener('resize',limitFeedTen);
function render(){
 const feed=$('feed');feed.replaceChildren();
 for(const p of posts.filter(x=>x.author&&x.uid)){
  const card=make('article',undefined,'post'),head=make('div',undefined,'post-head');
  head.append(make('strong',p.author||'历史匿名发布'));
  const t=make('time',p.createdAt?.toDate?.()?.toLocaleString('zh-CN')||'刚刚');head.append(t);card.append(head);
  if(p.text)card.append(make('p',p.text));
  if(p.photo?.startsWith('data:image/jpeg;base64,') && !(p.photos?.length)){
   const img=document.createElement('img');img.src=p.photo;img.alt='物品图片';img.loading='lazy';
   img.addEventListener('click',()=>openPhoto(p.photo));card.append(img);
  }
  if(Array.isArray(p.photos)&&p.photos.length){const gallery=make('div',undefined,'post-gallery');for(const src of p.photos){if(typeof src!=='string'||!src.startsWith('data:image/jpeg;base64,'))continue;const img=document.createElement('img');img.src=src;img.alt='物品图片';img.loading='lazy';img.onclick=()=>openPhoto(src);gallery.append(img)}card.append(gallery)}
  if(memberReady&&p.uid!==window.CCGMember?.user?.uid){const need=make('button','❤️ 我有需要','need');need.type='button';need.addEventListener('click',()=>{chosenPost=p;$('needItem').textContent='您正在申请这条闲置物品：'+(p.text||'图片所示物品');$('requester').value=window.CCGMember?.profile?.name||'';$('needDetails').value='';$('needStatus').textContent='';$('needDialog').hidden=false;$('requester').focus()});card.append(need);}
  if(memberReady&&p.uid===window.CCGMember?.user?.uid){
   const edit=make('button','编辑我的帖子');edit.type='button';edit.style.marginRight='8px';
   edit.onclick=()=>{editingPostId=p.id;$('body').value=p.text||'';selectedPhotos=Array.isArray(p.photos)&&p.photos.length?[...p.photos]:(p.photo?[p.photo]:[]);selectedPhoto=selectedPhotos[0]||'';renderPreviews();
    $('preview').hidden=!selectedPhoto;if(selectedPhoto)$('preview').src=selectedPhoto;
    $('publish').textContent='保存修改';$('publishStatus').textContent='正在编辑自己的帖子；选择图片可继续追加，最多4张。';
    $('postForm').scrollIntoView({behavior:'smooth'});};
   const del=make('button','删除我的帖子');del.type='button';
   del.onclick=async()=>{if(!confirm('确定删除自己的帖子吗？已提交的需求通知仍会保留在管理员记录中。'))return;
    try{
     const batch=db.batch();const ref=db.collection('carePosts').doc(p.id);
     batch.set(db.collection('carePostArchives').doc(p.id+'_deleted'),{postId:p.id,text:p.text||'',author:p.author||'',uid:p.uid,createdAt:p.createdAt||null,photo:p.photo||'',photos:Array.isArray(p.photos)?p.photos:[],archivedAt:firebase.firestore.FieldValue.serverTimestamp()});
     batch.delete(ref);await batch.commit();nextPage=null;await loadMore(true)
    }catch(e){alert('删除失败（帖子未删除）：'+e.message)}};
   card.append(edit,del);
  }
  feed.append(card);
 }
 const shown=posts.filter(x=>x.author&&x.uid).length;
 $('feedStatus').textContent=shown?'已显示 '+shown+' 条实名帖子':'暂无实名帖子，欢迎发布第一条！';
 $('more').hidden=!hasMore;
}
async function loadMore(reset=false){
 if(!db||loading)return;loading=true;$('more').disabled=true;
 try{
  let q=db.collection('carePosts').orderBy('createdAt','desc').limit(10);
  if(!reset&&nextPage)q=q.startAfter(nextPage);
  const snap=await q.get();
  if(reset)posts=[];
  posts.push(...snap.docs.map(d=>({id:d.id,...d.data()})));
  if(snap.docs.length)nextPage=snap.docs[snap.docs.length-1];
  hasMore=snap.size===10;render();
 }catch(e){$('feedStatus').textContent='帖子加载失败：'+e.message}
 finally{loading=false;$('more').disabled=false}
}
$('more').onclick=()=>loadMore();
async function compressImage(file){
 if(!file)return '';
 if(file.size>15*1024*1024)throw Error('图片文件不能超过15 MB');
 const url=URL.createObjectURL(file);
 try{
  const img=new Image();
  await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(Error('无法读取此图片，请改用 JPG 或 PNG'));img.src=url});
  if(img.width*img.height>42000000)throw Error('图片像素过大，请先缩小图片');
  for(const side of [1000,800,650,500,400]){
   const scale=Math.min(1,side/Math.max(img.width,img.height));
   const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   for(const quality of [.72,.55,.4]){
    const data=canvas.toDataURL('image/jpeg',quality);
    if(data.length<220000)return data;
   }
  }
  throw Error('图片压缩后仍过大，请换一张图片');
 }finally{URL.revokeObjectURL(url)}
}
function renderPreviews(){const root=$('photoPreviews');root.replaceChildren();for(const [i,src] of selectedPhotos.entries()){const box=document.createElement('div'),img=document.createElement('img'),remove=make('button','移除');img.src=src;img.alt='图片'+(i+1);remove.type='button';remove.style.cssText='display:block;padding:5px 8px;min-height:30px';remove.onclick=()=>{selectedPhotos.splice(i,1);selectedPhoto=selectedPhotos[0]||'';renderPreviews()};box.append(img,remove);root.append(box)}$('preview').hidden=true}
$('image').addEventListener('change',async e=>{
 const files=[...(e.target.files||[])];if(!files.length)return;
 if(files.length+selectedPhotos.length>4){$('publishStatus').textContent='最多只能添加4张图片';e.target.value='';return}
 $('publishStatus').textContent='正在处理图片…';$('image').disabled=true;
 try{for(const file of files)selectedPhotos.push(await compressImage(file));selectedPhoto=selectedPhotos[0]||'';renderPreviews();$('publishStatus').textContent='图片已准备好'}
 catch(err){$('publishStatus').textContent=err.message}finally{e.target.value='';$('image').disabled=false}
});
$('cancelNeed').onclick=()=>{if(!needBusy){$('needDialog').hidden=true;chosenPost=null}};
$('needDialog').addEventListener('click',e=>{if(e.target===$('needDialog'))$('cancelNeed').click()});
$('needForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!memberReady||!db||!chosenPost||needBusy||!window.CCGMember?.user)return;
 const requester=$('requester').value.trim(),details=$('needDetails').value.trim();
 if(!requester||requester.length>40||!details||details.length>500){$('needStatus').textContent='请填写称呼及需要的物品、数量';return}
 if(!confirm('确定将您的称呼、所需物品及数量发送给发布者吗？仅发布者和管理员可见。'))return;
 needBusy=true;$('sendNeed').disabled=true;$('needStatus').textContent='正在发送…';
 try{
  const id=db.collection('careNeeds').doc().id,stamp=firebase.firestore.FieldValue.serverTimestamp();
  const batch=db.batch();batch.set(db.collection('careNeeds').doc(id),{postId:chosenPost.id,requester,uid:window.CCGMember.user.uid,ownerUid:chosenPost.uid,ownerName:chosenPost.author||"",postText:(chosenPost.text||"").slice(0,1500),details,status:"pending",createdAt:stamp});
  if(chosenPost.uid)batch.set(db.collection('memberNotifications').doc(id),{uid:chosenPost.uid,postId:chosenPost.id,needId:id,text:details,createdAt:stamp});
  await batch.commit();
  $('needStatus').textContent='需求已发送；您和发布者均可在「我的消息」查看详情。';
  $('sendNeed').textContent='已发送';
  setTimeout(()=>{$('needDialog').hidden=true;chosenPost=null;$('sendNeed').textContent='发送给发布者'},1100);
 }catch(err){$('needStatus').textContent='发送失败：'+err.message}
 finally{needBusy=false;$('sendNeed').disabled=false}
});
$('postForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!db)return;
 if(!memberReady){$('publishStatus').textContent='请先登录会员平台后操作。';return;}
 const author=window.CCGMember?.profile?.name||'',text=$('body').value.trim();
 if(!author||author.length>40){$('publishStatus').textContent='请填写不超过40字的称呼';return}
 if(!text&&!selectedPhotos.length){$('publishStatus').textContent='请填写文字或上传图片';return}
 if(!confirm(editingPostId?'确定保存对这条帖子的修改吗？':'确定发布这条闲置物品信息吗？物品说明、照片和您的真实姓名会公开。'))return;
 const btn=$('publish');btn.disabled=true;$('publishStatus').textContent='正在发布…';
 try{
  if(editingPostId){await db.collection('carePosts').doc(editingPostId).update({text,photo:selectedPhotos[0]||'',photos:selectedPhotos});editingPostId=null;$('publish').textContent='发布物品';}
  else{const id=db.collection('carePosts').doc().id;await db.collection('carePosts').doc(id).set({text,photo:selectedPhotos[0]||'',photos:selectedPhotos,author,uid:window.CCGMember.user.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}
  $('body').value='';$('image').value='';$('preview').hidden=true;selectedPhoto='';selectedPhotos=[];renderPreviews();
  $('publishStatus').textContent='发布成功！您的真实姓名将公开显示。';nextPage=null;await loadMore(true);
 }catch(err){$('publishStatus').textContent='发布失败：'+err.message}
 finally{btn.disabled=false}
});
try{
 const config=window.FZH_FIREBASE_CONFIG;
 if(!config?.apiKey)throw Error('Firebase 配置缺失');
 const memberApp=firebase.apps.find(app=>app.name==='[DEFAULT]')||firebase.initializeApp(config);
 db=memberApp.firestore();ccgEnableFirestoreCache(db);window.CCGMember.ready.then(async m=>{
 memberReady=true;
 $('postForm').hidden=false;
 $('postForm').querySelectorAll('textarea,input,button').forEach(el=>el.disabled=false);
 $('postingIdentity').textContent='实名发布：'+m.profile.name;
 loadMore(true);
});
}catch(err){$('feedStatus').textContent='初始化失败：'+err.message}
</script><script src="./zh-toggle.js"></script></body></html>

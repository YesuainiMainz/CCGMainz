<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCG Mainz音乐角</title><style>
*{box-sizing:border-box}body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f3f6f3;color:#193c2d;margin:0}header{background:#24583e;color:white;padding:22px}main{max-width:850px;margin:20px auto;padding:0 14px}.post{height:248px;overflow-y:auto;box-sizing:border-box;background:white;border-radius:15px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #0001;min-height:170px}.post h2{margin-top:0}.post p{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}.post img.photo{max-width:100%;max-height:360px;border-radius:9px;margin:6px;object-fit:contain}.video{display:block;max-width:500px;color:inherit;text-decoration:none;border:1px solid #dbe6df;border-radius:12px;overflow:hidden;margin:12px 0}.video img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.video span{display:block;padding:12px;font-weight:600}a{color:#23694a}#list{max-height:744px;overflow-y:auto;overscroll-behavior:contain}small{color:#617869}
</style></head><body><header><div style="max-width:850px;margin:auto"><h1>🎵 CCG Mainz音乐角</h1><div>敬拜赞美 · 乐队排练 · 献诗花絮</div></div></header><main><p><a href="./platform.html">← 返回家人平台</a></p><nav style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0"><button id="recentBtn" type="button" onclick="switchMusic('recent')">近期音乐分享</button><button id="hymnsBtn" type="button" onclick="switchMusic('hymns')">常见赞美诗学习</button></nav><label>搜索名称或日期 <input id="musicSearch" type="search" oninput="renderMusic()" placeholder="输入名称或日期，如 2026-11-02" style="width:100%;padding:12px;border:1px solid #b6cbbd;border-radius:8px;margin:8px 0"></label><p id="status" role="status">正在验证会员身份…</p><section id="list" aria-label="音乐角帖子，每屏最多四条"></section></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="./firebase-config.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function safe(link){try{const u=new URL(link);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
function youtube(link){try{const u=new URL(link),h=u.hostname.toLowerCase().replace(/^www\./,'');let id='';if(h==='youtu.be')id=u.pathname.split('/')[1];else if(['youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com'].includes(h))id=u.searchParams.get('v')||u.pathname.match(/\/(?:shorts|embed|live)\/([\w-]{11})/)?.[1];return /^[\w-]{11}$/.test(id||'')?id:''}catch(e){return ''}}
const app=firebase.apps.find(x=>x.name==='[DEFAULT]')||firebase.initializeApp(window.FZH_FIREBASE_CONFIG),auth=app.auth(),db=app.firestore();let unsub=null,musicItems=[],musicCategory='recent';const ccgTargetPost=new URLSearchParams(location.search).get('post');let ccgTargetShown=false;
function switchMusic(c){musicCategory=c;document.getElementById('recentBtn').disabled=c==='recent';document.getElementById('hymnsBtn').disabled=c==='hymns';document.getElementById('musicSearch').value='';renderMusic()}
function renderMusic(){const list=document.getElementById('list');list.replaceChildren();const q=document.getElementById('musicSearch').value.trim().toLowerCase();const items=musicItems.filter(p=>(p.category||'recent')===musicCategory && (!q || (String(p.title||'')+' '+String(p.body||'')+' '+(p.createdAt?.toDate?.().toLocaleDateString('sv-SE')||'')+' '+(p.createdAt?.toDate?.().toLocaleDateString('zh-CN')||'')).toLowerCase().includes(q)));items.forEach(p=>{const article=document.createElement('article');article.className='post';if(p.id===ccgTargetPost){article.id='ccg-shared-post';article.style.outline='3px solid #2d875b';article.style.scrollMarginTop='20px'}const link=safe(p.link),id=youtube(link);const date=p.createdAt?.toDate?.();article.innerHTML=`<h2>${esc(p.title)}</h2>${date?`<small>${esc(date.toLocaleString('zh-CN'))}</small>`:''}<p>${esc(p.body)}</p>${(p.images||[]).map(x=>typeof x==='string'&&x.startsWith('data:image/')?`<img class="photo" alt="音乐角图片" src="${x}">`:'').join('')}${link?`<a class="video" target="_blank" rel="noopener noreferrer" href="${esc(link)}">${id?`<img loading="lazy" src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="YouTube 视频封面">`:''}<span>${id?'▶ 打开 YouTube 视频':'🔗 打开分享链接'}</span></a>`:''}`;list.append(article)});if(ccgTargetPost&&!ccgTargetShown){const target=document.getElementById('ccg-shared-post');if(target){ccgTargetShown=true;setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'center'}),180)}}document.getElementById('status').textContent=items.length?'共 '+items.length+' 条 · 每屏3条，滑动查看更多':'当前模块暂无匹配帖子'}
switchMusic('recent');
auth.onAuthStateChanged(async user=>{if(unsub){unsub();unsub=null}document.getElementById('list').innerHTML='';if(!user){document.getElementById('status').textContent='请先在家人平台登录';return}
try{const member=await db.doc('platformMembers/'+user.uid).get();if(!member.exists || (member.data()?.status && member.data().status!=='approved')){document.getElementById('status').textContent='需要管理员批准后才能查看';return}
unsub=db.collection('musicPosts').orderBy('createdAt','desc').onSnapshot(s=>{musicItems=s.docs.map(d=>({id:d.id,...d.data()}));if(ccgTargetPost){const found=musicItems.find(p=>p.id===ccgTargetPost);if(found)musicCategory=found.category||'recent';else document.getElementById('status').textContent='分享的帖子可能已删除';document.getElementById('recentBtn').disabled=musicCategory==='recent';document.getElementById('hymnsBtn').disabled=musicCategory==='hymns'}renderMusic()},e=>document.getElementById('status').textContent='加载失败：'+e.message)
}catch(e){document.getElementById('status').textContent='验证失败：'+e.message}});
</script></body></html>

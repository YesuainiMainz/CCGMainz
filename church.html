<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCGMainz · 教会生活</title><style>
*{box-sizing:border-box}body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f3f6f3;color:#173d2c;margin:0}header{background:#245b43;color:white;padding:20px}main{max-width:880px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 9px #0001}button{background:#27694e;color:white;border:0;border-radius:8px;padding:9px 13px;margin:5px;cursor:pointer}button:disabled{opacity:.5}textarea,input,select{padding:10px;border:1px solid #c9d6cc;border-radius:8px;max-width:100%}textarea{width:100%}.muted{color:#63766b;font-size:13px}.photo{max-width:230px;max-height:230px;object-fit:contain}.interaction{border-top:1px solid #e4eae5;padding-top:10px;margin-top:10px}a{color:inherit}
</style></head><body><header><a href="./platform.html" style="color:white">← 返回幸福家人平台</a><h1>⛪ 教会生活</h1><p>分享教会动态，参与活动互动</p></header><main><p id="status">正在验证会员身份…</p><div id="feed"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="./firebase-config.js"></script><script src="./member-session.js"></script><script>
const $=id=>document.getElementById(id);let db,uid,name,unsub=null,interactionUnsub=null,posts=[];let interactionData=[];
function node(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function button(label,fn){const b=node('button',label);b.type='button';b.onclick=fn;return b}
function elPhoto(src){const img=node('img');img.className='photo';img.src=src;img.alt='会员分享的照片';return img}
function uploadImage(file){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(Error('请选择图片'));const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,700/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.6);if(data.length>190000)data=c.toDataURL('image/jpeg',.35);if(data.length>190000)reject(Error('图片太大，请选择较小的照片'));else resolve(data)};img.onerror=()=>reject(Error('无法打开图片'));img.src=r.result};r.onerror=()=>reject(Error('图片读取失败'));r.readAsDataURL(file)})}
async function interact(post,type,value='',photo=''){
 const ref=db.collection('churchInteractions').doc(post.id+'_'+type+'_'+uid);
 const payload={postId:post.id,type,uid,author:name,value,photo,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
 try{if(type==='like'){const existing=interactionData.find(x=>x.id===ref.id);if(existing)await ref.delete();else await ref.set(payload)}else await ref.set(payload);$('status').textContent='互动已保存'}catch(e){alert('互动失败：'+e.message)}
}
function render(){const feed=$('feed');feed.replaceChildren();for(const post of posts){if(post.active===false)continue;const card=node('article');card.className='card';card.append(node('h2',post.title),node('p',post.body));const items=interactionData.filter(x=>x.postId===post.id),opts=post.options||{};
 if(opts.like){const likes=items.filter(x=>x.type==='like');card.append(button('👍 点赞 '+likes.length+(likes.some(x=>x.uid===uid)?'（已点赞）':''),()=>interact(post,'like')))}
 if(opts.vote){const box=node('div');box.className='interaction';box.append(node('h3','投票（每位会员一票，可修改）'));for(const choice of post.voteOptions||[]){const count=items.filter(x=>x.type==='vote'&&x.value===choice).length;box.append(button(choice+' · '+count+'票',()=>interact(post,'vote',choice)))}card.append(box)}
 if(opts.photo){const box=node('div');box.className='interaction';box.append(node('h3','照片分享'));const input=node('input');input.type='file';input.accept='image/*';const send=button('上传照片',async()=>{try{send.disabled=true;const data=await uploadImage(input.files[0]);await interact(post,'photo','',data)}catch(e){alert(e.message)}finally{send.disabled=false}});box.append(input,send);for(const i of items.filter(x=>x.type==='photo'&&x.photo)){const p=node('div',i.author+'：');p.append(elPhoto(i.photo));box.append(p)}card.append(box)}
 if(opts.chain){const box=node('div');box.className='interaction';box.append(node('h3','接龙'));const input=node('textarea');input.maxLength=500;input.rows=2;input.placeholder='输入您的接龙内容';const my=items.find(x=>x.type==='chain'&&x.uid===uid);if(my)input.value=my.value;box.append(input,button('提交接龙',()=>{const v=input.value.trim();if(v)interact(post,'chain',v)}));items.filter(x=>x.type==='chain').sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)).forEach((x,i)=>box.append(node('p',(i+1)+'. '+x.author+'：'+x.value)));card.append(box)}feed.append(card)}if(!feed.children.length)feed.append(node('p','目前没有已发布的教会生活帖子。'))}
async function init(){try{await window.CCGMember.ready;const m=window.CCGMember;uid=m.user.uid;name=m.profile.name||'会员';const app=firebase.apps[0];db=app.firestore();$('status').textContent='已登录：'+name;
 unsub=db.collection('churchPosts').orderBy('createdAt','desc').limit(50).onSnapshot(s=>{posts=s.docs.map(x=>({id:x.id,...x.data()}));render()},e=>$('status').textContent='读取帖子失败：'+e.message);
 interactionUnsub=db.collection('churchInteractions').limit(500).onSnapshot(s=>{interactionData=s.docs.map(x=>({id:x.id,...x.data()}));render()},e=>$('status').textContent='读取互动失败：'+e.message)
 }catch(e){$('status').textContent='请先登录并等待管理员批准会员申请。';const link=node('a','返回登录');link.href='./platform.html';$('status').append(' ',link)}}
init();
</script><script src="./zh-toggle.js"></script></body></html>
